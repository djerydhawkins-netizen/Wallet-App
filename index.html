<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0d2440;
    --bg-alt: #081729;
    --paper: #f7f4ee;
    --paper-2: #ece7db;
    --ink: #1c2733;
    --ink-soft: #5c6b7a;
    --gold: #2fa66b;
    --amber: #cc7a2e;
    --rust: #b25139;
    --green-ok: #3f8f5f;
    --line: rgba(28,39,51,0.14);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0;}
  body{
    background: var(--bg);
    background-image:
      radial-gradient(circle at 20% 0%, rgba(255,255,255,0.05), transparent 40%),
      radial-gradient(circle at 100% 100%, rgba(0,0,0,0.15), transparent 50%);
    font-family: 'Inter', sans-serif;
    color: var(--paper);
    min-height: 100vh;
    display:flex;
    justify-content:center;
  }
  #app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    position:relative;
    padding-bottom: 96px;
  }

  /* ---- Header ---- */
  header.top{
    padding: 20px 20px 14px;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .eyebrow-row{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .logo-badge{
    width:44px;
    height:44px;
    border-radius:50%;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    box-shadow: 0 1px 4px rgba(0,0,0,0.2);
  }
  .app-logo{
    height:36px;
    width:auto;
    display:block;
  }
  h1.month{
    position:absolute;
    left:50%;
    top:50%;
    transform: translate(-50%, -50%);
    z-index:2;
    white-space:nowrap;
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color: rgba(247,244,238,0.55);
  }
  .sync-badge{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    letter-spacing:0.04em;
    color: rgba(247,244,238,0.45);
    white-space:normal;
    text-align:right;
    max-width:88px;
    line-height:1.3;
  }
  .sync-badge.saving{ color: var(--gold); }
  .sync-badge.saved{ color: rgba(247,244,238,0.45); }
  .sync-badge.error{ color: #e08a6f; }
  .sync-badge.preview{ color: var(--gold); }
  .preview-link{
    background:none; border:none;
    font-family:'Inter', sans-serif;
    font-size:12px;
    color: var(--ink-soft);
    text-decoration: underline;
    cursor:pointer;
  }
  .header-right{
    display:flex;
    align-items:center;
    gap:10px;
    flex-shrink:0;
  }
  .gear-btn{
    background: rgba(247,244,238,0.12);
    border: 1px solid rgba(247,244,238,0.22);
    color: var(--paper);
    width:32px; height:32px;
    border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    padding:0;
  }
  .gear-btn:active{ background: rgba(247,244,238,0.22); }
  .settings-overlay{
    position:fixed; inset:0;
    background: rgba(15,22,17,0.5);
    display:flex;
    justify-content:center;
    z-index:40;
  }
  .settings-panel{
    background: var(--bg-alt);
    width:100%;
    max-width:480px;
    height:100%;
    overflow-y:auto;
    animation: slideDown .16s ease-out;
    padding-bottom:40px;
  }
  @keyframes slideDown{ from{ transform: translateY(-14px); opacity:0;} to{ transform:none; opacity:1;} }
  .settings-panel-head{
    position:sticky; top:0;
    background: var(--bg-alt);
    display:flex; align-items:center; justify-content:space-between;
    padding: 20px 18px 12px;
    border-bottom: 1px solid rgba(247,244,238,0.1);
  }
  .settings-panel-head h2{
    font-family:'Zilla Slab', serif;
    color: var(--paper);
    margin:0;
    font-size:20px;
  }
  .close-btn{
    background: rgba(247,244,238,0.1);
    border:none;
    color: var(--paper);
    width:30px; height:30px;
    border-radius:50%;
    cursor:pointer;
    font-size:14px;
  }
  .settings-panel-body{
    padding: 16px 16px 0;
  }
  h1.month{
    font-family:'Zilla Slab', serif;
    font-weight:600;
    font-size:30px;
    margin:0;
    letter-spacing:-0.01em;
  }
  .setup-title{
    font-family:'Zilla Slab', serif;
    font-weight:600;
    letter-spacing:-0.01em;
    margin:0;
  }
  .total-row{
    margin-top:14px;
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .total-label{
    font-size:13px;
    color: rgba(247,244,238,0.6);
  }
  .total-amt{
    font-family:'IBM Plex Mono', monospace;
    font-size:22px;
    font-weight:600;
  }

  /* ---- Tabs ---- */
  nav.tabs{
    display:flex;
    margin: 4px 20px 16px;
    border-radius: 999px;
    border: 1px solid rgba(247,244,238,0.25);
    overflow:hidden;
  }
  nav.tabs button{
    flex:1;
    font-family:'Inter', sans-serif;
    font-size:13px;
    font-weight:600;
    padding:10px 14px;
    border:none;
    background: transparent;
    color: rgba(247,244,238,0.7);
    cursor:pointer;
  }
  nav.tabs button:first-child{
    border-right: 1px solid rgba(247,244,238,0.25);
  }
  nav.tabs button.active{
    background: var(--paper);
    color: var(--ink);
  }

  main.tab-viewport{
    flex:1;
    overflow:hidden;
  }
  .tab-track{
    display:flex;
    width:200%;
    transition: transform 0.32s cubic-bezier(.4,0,.2,1);
  }
  .tab-panel{
    width:50%;
    flex-shrink:0;
    box-sizing:border-box;
    display:flex;
    flex-direction:column;
    gap:16px;
    padding: 4px 16px 20px;
  }

  /* ---- Envelope card (signature element) ---- */
  .envelope{
    position:relative;
    background: var(--paper);
    color: var(--ink);
    border-radius: 0;
    margin: 0 -16px;
    padding: 16px 18px 14px;
    cursor:pointer;
    overflow:hidden;
    border-top: 1px solid rgba(0,0,0,0.06);
    border-bottom: 1px solid rgba(0,0,0,0.06);
    transition: transform .12s ease;
  }
  .envelope:active{ transform: scale(0.98); }
  .env-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    position:relative;
    z-index:1;
  }
  .env-name{
    font-family:'Zilla Slab', serif;
    font-weight:600;
    font-size:19px;
  }
  .env-type{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    padding: 3px 8px;
    border-radius: 999px;
    margin-top:3px;
    display:inline-block;
  }
  .env-type.rollover{ background: rgba(47,166,107,0.16); color:#1f7a4d; }
  .env-type.reset{ background: rgba(21,74,114,0.14); color:#154a72; }

  .env-balance{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:26px;
    text-align:right;
  }
  .env-balance.low{ color: var(--rust); }

  .env-bottom{
    margin-top:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .env-budget{
    font-size:12px;
    color: var(--ink-soft);
  }
  .env-bar{
    flex:1;
    height:5px;
    background: rgba(28,39,51,0.1);
    border-radius:3px;
    margin-left:12px;
    overflow:hidden;
  }
  .env-bar-fill{
    height:100%;
    border-radius:3px;
    background: var(--green-ok);
  }
  .env-debt{
    margin-top:8px;
    font-size:11px;
    color: var(--amber);
    font-weight:600;
  }

  .empty-state{
    text-align:center;
    padding: 60px 24px;
    color: rgba(247,244,238,0.6);
  }
  .empty-state h2{
    font-family:'Zilla Slab', serif;
    color: var(--paper);
    margin-bottom:8px;
  }
  .empty-state button{
    margin-top:16px;
  }

  /* ---- History ---- */
  .filter-chips{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:2px;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .filter-chips::-webkit-scrollbar{ display:none; }
  .filter-chip{
    flex-shrink:0;
    font-family:'Inter', sans-serif;
    font-size:12px;
    font-weight:600;
    padding:7px 13px;
    border-radius:999px;
    border:1px solid rgba(247,244,238,0.25);
    background:transparent;
    color: rgba(247,244,238,0.7);
    cursor:pointer;
    white-space:nowrap;
  }
  .filter-chip.active{
    background: var(--paper);
    color: var(--ink);
    border-color: var(--paper);
  }
  .tx-row{
    background: var(--paper);
    color: var(--ink);
    border-radius: 12px;
    padding: 14px 16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
  }
  .tx-info .tx-cat{ font-weight:600; font-size:14px; }
  .tx-info .tx-note{ font-size:12px; color: var(--ink-soft); margin-top:2px; }
  .tx-info .tx-date{ font-family:'IBM Plex Mono', monospace; font-size:10px; color: var(--ink-soft); margin-top:4px; }
  .tx-amt{ font-family:'IBM Plex Mono', monospace; font-weight:600; color: var(--rust); white-space:nowrap; }
  .tx-del{
    background:none; border:none; color: var(--ink-soft); font-size:16px; cursor:pointer; padding:4px 6px;
  }
  .tx-edit{
    background:none; border:none; color: var(--ink-soft); cursor:pointer; padding:4px 6px;
    display:flex; align-items:center;
  }

  /* ---- Settings ---- */
  .settings-card{
    background: var(--paper);
    color: var(--ink);
    border-radius: 12px;
    padding: 14px 16px;
  }
  .settings-card + .settings-card{ margin-top: 10px; }
  .cat-summary-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
  }
  .pencil-btn{
    background: rgba(28,39,51,0.06);
    border:1px solid rgba(28,39,51,0.12);
    color: var(--ink-soft);
    width:34px; height:34px;
    border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex-shrink:0;
  }
  .pencil-btn:active{ background: rgba(28,39,51,0.12); }
  .cat-reorder{
    display:flex;
    flex-direction:column;
    gap:3px;
    flex-shrink:0;
  }
  .reorder-btn{
    background: rgba(28,39,51,0.06);
    border:1px solid rgba(28,39,51,0.12);
    color: var(--ink-soft);
    width:26px; height:20px;
    border-radius:5px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    padding:0;
  }
  .reorder-btn:active{ background: rgba(28,39,51,0.12); }
  .reorder-btn:disabled{
    opacity:0.25;
    cursor:default;
  }
  .reorder-btn:disabled:active{ background: rgba(28,39,51,0.06); }
  .cat-summary-bottom{
    display:flex;
    justify-content:space-between;
    margin-top:12px;
    padding-top:10px;
    border-top: 1px dashed rgba(28,39,51,0.16);
    font-size:12px;
    color: var(--ink-soft);
  }
  .cat-summary-bottom b{
    font-family:'IBM Plex Mono', monospace;
    color: var(--ink);
    font-size:13px;
  }
  .set-row{ display:flex; align-items:center; gap:10px; }
  .set-row input[type=text]{
    font-family:'Zilla Slab', serif;
    font-size:16px;
    font-weight:600;
    border:none; background:transparent; color:var(--ink);
    flex:1; padding:2px 0;
    border-bottom: 1px solid transparent;
  }
  .set-row input[type=text]:focus{ outline:none; border-bottom:1px solid var(--ink-soft); }
  .set-sub{ display:flex; gap:14px; margin-top:8px; align-items:center; flex-wrap:wrap;}
  .set-sub label{ font-size:12px; color:var(--ink-soft); display:flex; align-items:center; gap:5px;}
  .amt-input{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    border:1px solid rgba(28,39,51,0.2);
    border-radius:6px;
    padding:5px 7px;
    width:90px;
    background:#fff;
    color:var(--ink);
  }
  .type-toggle{
    display:flex; gap:4px;
  }
  .type-toggle button{
    font-size:11px;
    font-family:'IBM Plex Mono', monospace;
    padding:4px 8px;
    border-radius:6px;
    border:1px solid rgba(28,39,51,0.2);
    background:transparent;
    color: var(--ink-soft);
    cursor:pointer;
  }
  .type-toggle button.on{
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }
  .del-cat{
    background:none;border:none;color:var(--rust);font-size:13px;cursor:pointer;
    margin-left:auto;
  }
  .bal-row{
    display:flex; align-items:center; justify-content:space-between;
    margin-top:10px; padding-top:10px;
    border-top: 1px dashed rgba(28,39,51,0.16);
  }
  .bal-current{
    font-size:12px; color: var(--ink-soft);
  }
  .bal-current b{
    font-family:'IBM Plex Mono', monospace;
    color: var(--ink);
    font-size:13px;
  }
  .adjust-link{
    background:none; border:none; color:#1f7a4d; font-size:12px; font-weight:700;
    cursor:pointer; text-decoration:underline;
  }
  .warn-box{
    background: rgba(178,81,57,0.1);
    border: 1px solid rgba(178,81,57,0.35);
    color: #7a3423;
    border-radius:10px;
    padding:12px 14px;
    font-size:13px;
    line-height:1.45;
    margin-bottom:14px;
  }
  .warn-box b{ display:block; margin-bottom:4px; color: var(--rust); }
  .preview-list{
    margin-bottom:16px;
    max-height:220px;
    overflow-y:auto;
    border-radius:10px;
    border: 1px solid rgba(28,39,51,0.12);
  }
  .preview-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:13px;
    padding:10px 12px;
    border-bottom: 1px solid rgba(28,39,51,0.08);
  }
  .preview-row:last-child{ border-bottom:none; }
  .preview-row span:first-child{ color: var(--ink-soft); }
  .preview-row span:last-child{ font-family:'IBM Plex Mono', monospace; }
  .tx-amt.pos{ color: var(--green-ok); }
  .tx-amt.borrow{ color: var(--amber); }

  button.primary{
    background: var(--gold);
    color: #fff;
    border:none;
    font-family:'Inter', sans-serif;
    font-weight:700;
    font-size:14px;
    padding: 12px 18px;
    border-radius: 10px;
    cursor:pointer;
  }
  button.ghost{
    background: transparent;
    color: var(--paper);
    border: 1px solid rgba(247,244,238,0.3);
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:13px;
    padding: 10px 14px;
    border-radius: 10px;
    cursor:pointer;
  }
  .add-cat-btn{
    width:100%;
    padding:14px;
    border-radius:12px;
    border: 1px dashed rgba(247,244,238,0.35);
    background:transparent;
    color: rgba(247,244,238,0.75);
    font-family:'Inter', sans-serif;
    font-weight:600;
    cursor:pointer;
  }

  /* ---- FAB ---- */
  .fab{
    position:fixed;
    bottom:24px;
    left:50%;
    transform: translateX(-50%);
    max-width:480px;
    width:100%;
    box-sizing:border-box;
    padding: 0 20px;
    display:flex;
    justify-content:flex-end;
    pointer-events:none;
    z-index:25;
  }
  .fab button{
    pointer-events:all;
    background: var(--gold);
    color:#fff;
    border:none;
    font-family:'Inter', sans-serif;
    font-weight:700;
    font-size:28px;
    width:56px;
    height:56px;
    border-radius:50%;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    line-height:1;
    padding:0;
  }

  /* ---- Sheet / modal ---- */
  .overlay{
    position:fixed; inset:0;
    background: rgba(15,22,17,0.55);
    display:flex; align-items:flex-end; justify-content:center;
    z-index:50;
  }
  .sheet{
    background: var(--paper);
    color: var(--ink);
    width:100%;
    max-width:480px;
    border-radius: 20px 20px 0 0;
    padding: 22px 20px 28px;
    animation: rise .18s ease-out;
  }
  @keyframes rise{ from{ transform: translateY(16px); opacity:0;} to{ transform:none; opacity:1;} }
  .sheet h2{
    font-family:'Zilla Slab', serif;
    margin: 0 0 16px;
    font-size:21px;
  }
  .field{ margin-bottom:14px; }
  .field label{
    display:block; font-size:12px; color: var(--ink-soft); margin-bottom:6px;
    text-transform:uppercase; letter-spacing:0.06em; font-family:'IBM Plex Mono', monospace;
  }
  .cat-pick{
    display:flex; flex-wrap:wrap; gap:8px;
  }
  .cat-pick button{
    padding: 9px 13px;
    border-radius: 10px;
    border: 1px solid rgba(28,39,51,0.18);
    background:#fff;
    font-size:13px;
    font-weight:600;
    color: var(--ink);
    cursor:pointer;
  }
  .cat-pick button.sel{
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }
  .amt-big{
    width:100%;
    font-family:'IBM Plex Mono', monospace;
    font-size:32px;
    font-weight:600;
    border:none;
    border-bottom: 2px solid rgba(28,39,51,0.18);
    background:transparent;
    padding: 6px 0;
    color:var(--ink);
  }
  .amt-big:focus{ outline:none; border-color: var(--gold); }
  .note-in{
    width:100%;
    font-family:'Inter', sans-serif;
    font-size:14px;
    border:1px solid rgba(28,39,51,0.18);
    border-radius:8px;
    padding:10px 12px;
    background:#fff;
    color:var(--ink);
  }
  .sheet-actions{ display:flex; gap:10px; margin-top:8px; }
  .sheet-actions button.primary{ flex:1; }
  .sheet-actions button.ghost-dark{
    background:transparent; border:1px solid rgba(28,39,51,0.2); color: var(--ink);
    font-weight:600; padding:12px 16px; border-radius:10px; cursor:pointer;
  }
  .err{ color: var(--rust); font-size:12px; margin-top:-6px; margin-bottom:10px; }
  .month-note{
    font-size:12px;
    color: rgba(247,244,238,0.55);
    padding: 0 20px 8px;
  }
  .setup-wrap{
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding: 56px 20px 24px;
  }
  .setup-card{
    background: var(--paper);
    color: var(--ink);
    border-radius: 16px;
    padding: 26px 22px;
    width:100%;
    max-width:400px;
  }
</style>
</head>
<body>

function uid(){ return Math.random().toString(36).slice(2,10); }
function currentYM(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
}
function monthLabel(){
  return new Date().toLocaleString('en-US', { month:'long' });
}
function fmt(n){
  const neg = n < 0;
  const v = Math.abs(n).toFixed(2);
  return (neg?'-':'') + '$' + v;
}

/* ---------- Config (Google Sheet connection) ---------- */
function getConfig(){
  try{
    const raw = localStorage.getItem(CONFIG_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch(e){ return null; }
}
function saveConfig(cfg){
  localStorage.setItem(CONFIG_KEY, JSON.stringify(cfg));
  config = cfg;
}
function clearConfig(){
  localStorage.removeItem(CONFIG_KEY);
  config = null;
}

function openReconnect(){
  setupMode = true;
  setupError = '';
  render();
}

  return `

async function testAndSaveConfig(){
  const url = document.getElementById('setupUrl').value.trim();
  const token = document.getElementById('setupToken').value.trim();
  if(!url || !token){
    setupError = 'Enter both the Web App URL and the password.';
    render();
    return;
  }
  setupTesting = true;
  setupError = '';
  render();
  try{
    const testUrlObj = new URL(url);
    testUrlObj.searchParams.set('key', STORAGE_KEY);
    testUrlObj.searchParams.set('token', token);
    const res = await fetch(testUrlObj.toString());
    const data = await res.json();
    if(data.error){
      setupError = data.error === 'unauthorized'
        ? 'That password was rejected by the script — double check it matches SECRET exactly.'
        : 'The script returned an error: ' + data.error;
      setupTesting = false;
      render();
      return;
    }
    saveConfig({ url, token });
    setupMode = false;
    setupTesting = false;
    demoMode = false;
    await loadData();
    startPolling();
  } catch(e){
    setupError = 'Could not reach that URL. Check it was copied in full and ends in /exec.';
    setupTesting = false;
    render();
  }
}

/* ---------- Remote storage via Google Apps Script ---------- */
async function remoteGet(key){
  const u = new URL(config.url);
  u.searchParams.set('key', key);
  u.searchParams.set('token', config.token);
  const res = await fetch(u.toString());
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  return data.value;
}
async function remoteSet(key, value){
  // Sent as text/plain to avoid a CORS preflight that Apps Script can't handle.
  const res = await fetch(config.url, {
    method: 'POST',
    body: JSON.stringify({ key, value, token: config.token })
  });
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  return data;
}

async function loadData(silent){
  if(demoMode) return; // preview mode never touches the network
  if(!silent) syncState = 'idle';
  try{
    const value = await remoteGet(STORAGE_KEY);
    if(value){
      state = JSON.parse(value);
    } else if(!silent){
      state = {
        categories: DEFAULT_CATEGORIES.map(c => ({ id: uid(), ...c, balance: c.amount })),
        transactions: [],
        lastMonthProcessed: currentYM()
      };
      await persist();
    }
    syncState = 'saved';
  } catch(e){
    console.error('load failed', e);
    syncState = 'error';
    if(!loaded){
      // first ever load and it failed — still show the empty defaults locally
      state = {
        categories: DEFAULT_CATEGORIES.map(c => ({ id: uid(), ...c, balance: c.amount })),
        transactions: [],
        lastMonthProcessed: currentYM()
      };
    }
  }
  processMonthRollover();
  loaded = true;
  render();
}

async function persist(){
  if(demoMode){ syncState = 'idle'; renderSyncBadge(); return; } // preview mode: keep changes in memory only
  syncState = 'saving';
  renderSyncBadge();
  try{
    await remoteSet(STORAGE_KEY, JSON.stringify(state));
    syncState = 'saved';
  } catch(e){
    console.error('save failed', e);
    syncState = 'error';
  }
  renderSyncBadge();
}

function renderSyncBadge(){
  const el = document.getElementById('syncBadge');
  if(!el) return;
  const map = {
    idle: ['', ''],
    saving: ['Saving…', 'saving'],
    saved: ['Synced', 'saved'],
    error: ['Not synced — check connection', 'error']
  };
  if(demoMode){
    el.textContent = 'Preview mode — not saved';
    el.className = 'sync-badge preview';
    return;
  }
  const [label, cls] = map[syncState] || ['',''];
  el.textContent = label;
  el.className = 'sync-badge ' + cls;
}

function startPolling(){
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(() => {
    if(document.hidden) return;
    if(sheet) return; // don't yank the screen while someone is mid-entry
    loadData(true);
  }, 20000);
}

function processMonthRollover(){
  const ym = currentYM();
  if(state.lastMonthProcessed === ym) return;
  applyMonthRollover();
}

function applyMonthRollover(){
  let leftover = 0;
  state.categories.forEach(c => {
    const owed = c.borrowed || 0;
    if(c.type === 'reset'){
      leftover += Math.max(0, c.balance);
      const effectiveAmount = Math.max(0, c.amount - owed);
      c.balance = effectiveAmount;
      c.borrowed = Math.max(0, owed - c.amount);
    } else {
      const effectiveAmount = c.amount - owed;
      c.balance = (c.balance || 0) + effectiveAmount;
      c.borrowed = Math.max(0, owed - c.amount);
    }
  });
  state.lastMonthProcessed = currentYM();

  const rolloverCats = state.categories.filter(c => c.type === 'rollover');
  if(leftover > 0.004 && rolloverCats.length > 0){
    const allocations = {};
    rolloverCats.forEach(c => { allocations[c.id] = ''; });
    state.pendingLeftover = { leftover, allocations };
  }
  persist();

  if(state.pendingLeftover){
    openLeftoverSheet();
  }
}

function openLeftoverSheet(){
  if(!state.pendingLeftover) return;
  sheet = { type: 'leftover', error: '' };
}

function openLeftoverSheetAndRender(){
  openLeftoverSheet();
  render();
}

function totalAvailable(){
  return state.categories.reduce((s,c)=> s + c.balance, 0);
}

function renderHome(){
  if(state.categories.length === 0){
    return `<div class="empty-state">
      <h2>No funds yet</h2>
      <p>Add your first fund in Settings to get started.</p>
    </div>`;
  }
  return state.categories.map(c => {
    const pct = c.amount > 0 ? Math.max(0, Math.min(100, (c.balance / c.amount) * 100)) : 0;
    const ratio = c.amount > 0 ? c.balance / c.amount : 1;
    const low = c.balance < 0;
    let barColor = 'var(--green-ok)';
    if(ratio <= 0.125) barColor = 'var(--rust)';
    else if(ratio <= 0.25) barColor = 'var(--amber)';
    return `<div class="envelope" onclick="openLogSheet('${c.id}')">
      <div class="env-top">
        <div>
          <div class="env-name">${escapeHtml(c.name)}</div>
          <span class="env-type ${c.type}">${c.type === 'rollover' ? 'Rolls over' : 'Resets monthly'}</span>
        </div>
        <div class="env-balance ${low?'low':''}">${fmt(c.balance)}</div>
      </div>
      <div class="env-bottom">
        <div class="env-budget">of ${fmt(c.amount)}/mo</div>
        <div class="env-bar"><div class="env-bar-fill" style="width:${pct}%; background:${barColor}"></div></div>
      </div>
      ${c.borrowed > 0.004 ? `<div class="env-debt">Owes ${fmt(c.borrowed)} to next month</div>` : ''}
    </div>`;
  }).join('');
}

function renderHistory(){
  const filterChips = state.categories.length > 0 ? `<div class="filter-chips">
    <button class="filter-chip ${historyFilter==='all'?'active':''}" onclick="setHistoryFilter('all')">All</button>
    ${state.categories.map(c => `<button class="filter-chip ${historyFilter===c.id?'active':''}" onclick="setHistoryFilter('${c.id}')">${escapeHtml(c.name)}</button>`).join('')}
  </div>` : '';

  const filtered = historyFilter === 'all'
    ? state.transactions
    : state.transactions.filter(t => t.categoryId === historyFilter);

  if(state.transactions.length === 0){
    return `<div class="empty-state"><h2>Nothing logged yet</h2><p>Tap a fund to log a purchase, or use the + button to add funds.</p></div>`;
  }
  if(filtered.length === 0){
    const catName = state.categories.find(c => c.id === historyFilter);
    return `${filterChips}<div class="empty-state"><h2>No entries yet</h2><p>Nothing logged for ${catName ? escapeHtml(catName.name) : 'this fund'} so far.</p></div>`;
  }

  const sorted = [...filtered].sort((a,b)=> b.date.localeCompare(a.date));
  return filterChips + sorted.map(t => {
    const cat = state.categories.find(c => c.id === t.categoryId);
    const d = new Date(t.date);
    const catName = cat ? escapeHtml(cat.name) : 'Deleted fund';

    let label, noteLine, amtDisplay, amtClass, rowClass;

    if(t.kind === 'adjustment'){
      label = 'Balance adjusted';
      noteLine = `<div class="tx-note">${catName}</div>`;
      amtDisplay = `${t.amount >= 0 ? '+' : '-'}${fmt(Math.abs(t.amount))}`;
      amtClass = t.amount >= 0 ? 'tx-amt pos' : 'tx-amt';
      rowClass = 'adjustment';
    } else if(t.kind === 'deposit'){
      label = catName;
      noteLine = t.note ? `<div class="tx-note">${escapeHtml(t.note)}</div>` : `<div class="tx-note">Funds added</div>`;
      amtDisplay = `+${fmt(t.amount)}`;
      amtClass = 'tx-amt pos';
      rowClass = 'deposit';
    } else if(t.kind === 'borrow'){
      label = `Borrowed ahead — ${catName}`;
      noteLine = `<div class="tx-note">Next month's allotment will be ${fmt(t.amount)} lower</div>`;
      amtDisplay = fmt(t.amount);
      amtClass = 'tx-amt borrow';
      rowClass = 'borrow';
    } else {
      label = catName;
      noteLine = t.note ? `<div class="tx-note">${escapeHtml(t.note)}</div>` : '';
      amtDisplay = `-${fmt(t.amount)}`;
      amtClass = 'tx-amt';
      rowClass = '';
    }

    const editable = (t.kind === 'purchase' || t.kind === 'deposit');

    return `<div class="tx-row ${rowClass}">
      <div class="tx-info">
        <div class="tx-cat">${label}</div>
        ${noteLine}
        <div class="tx-date">${d.toLocaleDateString('en-US',{month:'short', day:'numeric', hour:'numeric', minute:'2-digit'})}</div>
      </div>
      <div style="display:flex; align-items:center; gap:2px;">
        <div class="${amtClass}">${amtDisplay}</div>
        ${editable ? `<button class="tx-edit" onclick="openEditTxSheet('${t.id}')" title="Edit">${pencilSvg()}</button>` : ''}
        <button class="tx-del" onclick="deleteTx('${t.id}')" title="Delete">✕</button>
      </div>
    </div>`;
  }).join('');
}

  if(demoMode){
    html += `<div class="settings-card" style="margin-top:10px;">

function renderSheet(){
  const existing = document.querySelector('.overlay');
  if(existing) existing.remove();
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.onclick = (e) => { if(e.target === overlay && sheet.type !== 'overage') closeSheet(); };

  if(sheet.type === 'adjust'){
    overlay.innerHTML = renderAdjustSheetHtml();
    document.getElementById('app').appendChild(overlay);
    if(!sheet.confirming){
      const valEl = document.getElementById('adjInput');
      if(valEl){
        valEl.focus();
        valEl.select();
        valEl.oninput = (e) => { sheet.value = e.target.value; };
      }
    }
    return;
  }

  if(sheet.type === 'delcat'){
    overlay.innerHTML = renderDeleteCatSheetHtml();
    document.getElementById('app').appendChild(overlay);
    return;
  }

  if(sheet.type === 'editcat'){
    overlay.innerHTML = renderEditCatSheetHtml();
    document.getElementById('app').appendChild(overlay);
    if(!sheet.confirming){
      const nameEl = document.getElementById('editNameInput');
      const amtEl2 = document.getElementById('editAmtInput');
      if(nameEl) nameEl.oninput = (e) => { sheet.name = e.target.value; };
      if(amtEl2) amtEl2.oninput = (e) => { sheet.amount = e.target.value; };
    }
    return;
  }

  if(sheet.type === 'edittx'){
    overlay.innerHTML = renderEditTxSheetHtml();
    document.getElementById('app').appendChild(overlay);
    if(!sheet.confirming){
      const amtEl3 = document.getElementById('editTxAmtInput');
      const noteEl3 = document.getElementById('editTxNoteInput');

        </div>
      </div>

    return;
  }

  const catButtons = state.categories.map(c =>
    `<button class="${sheet.categoryId===c.id?'sel':''}" onclick="pickCat('${c.id}')">${escapeHtml(c.name)}</button>`
  ).join('');

  overlay.innerHTML = `
    <div class="sheet">
      <h2>Log a purchase</h2>
      <div class="field">
        <label>From which fund</label>
        <div class="cat-pick">${catButtons || '<span style="font-size:13px;color:var(--ink-soft)">Add a fund in Settings first</span>'}</div>
      </div>
      <div class="field">
        <label>Amount spent</label>
        <input class="amt-big" id="amtInput" type="number" inputmode="decimal" step="0.01" placeholder="0.00" value="${sheet.amount}">
      </div>

      </div>
      ${sheet.error ? `<div class="err">${sheet.error}</div>` : ''}
      <div class="sheet-actions">
        <button class="ghost-dark" onclick="closeSheet()">Cancel</button>
        <button class="primary" onclick="submitLog()">Save</button>
      </div>
    </div>
  `;
  document.getElementById('app').appendChild(overlay);
  const amtEl = document.getElementById('amtInput');
  amtEl.focus();
  amtEl.oninput = (e) => { sheet.amount = e.target.value; };

}

function renderMonthTestSheetHtml(){
  const rows = state.categories.map(c => {
    const owed = c.borrowed || 0;
    const effectiveAmount = Math.max(0, c.amount - owed);
    const after = c.type === 'reset' ? effectiveAmount : (c.balance || 0) + (c.amount - owed);
    const debtNote = owed > 0.004 ? ` <span style="opacity:.6">(after paying back ${fmt(Math.min(owed, c.amount))} owed)</span>` : '';
    return `<div class="preview-row">
      <span>${escapeHtml(c.name)}</span>
      <span>${fmt(c.balance)} → <b>${fmt(after)}</b>${debtNote}</span>
    </div>`;
  }).join('');
  return `
    <div class="sheet">
      <h2>Simulate the 1st of the month?</h2>
      <div class="warn-box">
        <b>This runs the real monthly reset right now.</b>
        It's the exact same thing that happens automatically on the 1st — resetting fixed funds and adding this month's amount to rollover funds. If any reset funds were underspent, you'll be asked how to divvy up the leftover afterward. This changes your actual balances, not a copy, and can't be undone automatically.
      </div>
      <div class="preview-list">${rows}</div>
      <div class="sheet-actions">
        <button class="ghost-dark" onclick="closeSheet()">Cancel</button>
        <button class="primary" onclick="confirmMonthTest()">Yes, run it now</button>
      </div>
    </div>
  `;
}

function reviewEditCat(){
  const c = state.categories.find(c=>c.id===sheet.categoryId);

  const amount = parseFloat(sheet.amount);
  if(!name){ sheet.error = 'Give this fund a name.'; renderSheet(); return; }
  if(isNaN(amount) || amount < 0){ sheet.error = 'Enter a valid monthly amount.'; renderSheet(); return; }
  sheet.error = '';
  const currentAllowBorrow = c.allowBorrow !== false;
  if(name === c.name && amount === c.amount && sheet.catType === c.type && sheet.allowBorrow === currentAllowBorrow){
    // nothing changed, no need to confirm
    closeSheet();
    return;
  }
  sheet.confirming = true;
  renderSheet();
}

function commitEditCat(){

  c.name = sheet.name.trim();
  c.amount = parseFloat(sheet.amount) || 0;
  c.type = sheet.catType;
  c.allowBorrow = sheet.allowBorrow;
  persist();
  sheet = null;
  render();
}

function reviewEditTx(){
  const tx = state.transactions.find(t => t.id === sheet.txId);
  if(!tx){ closeSheet(); return; }
  const amt = parseFloat(sheet.amount);
  if(isNaN(amt) || amt <= 0){ sheet.error = 'Enter an amount greater than 0.'; renderSheet(); return; }
  sheet.error = '';
  const noteChanged = sheet.note.trim() !== (tx.note || '');
  if(amt === tx.amount && !noteChanged){
    closeSheet();
    return;
  }
  sheet.confirming = true;
  renderSheet();
}

function commitEditTx(){
  const tx = state.transactions.find(t => t.id === sheet.txId);
  if(!tx){ sheet = null; render(); return; }
  const cat = state.categories.find(c => c.id === tx.categoryId);
  const newAmt = parseFloat(sheet.amount) || 0;
  const oldAmt = tx.amount;
  if(cat){
    if(tx.kind === 'deposit'){
      cat.balance += (newAmt - oldAmt);
    } else {
      cat.balance += (oldAmt - newAmt);
    }
  }
  tx.amount = newAmt;
  tx.note = sheet.note.trim();
  persist();
  sheet = null;
  render();
}

  sheet.confirming = true;
  renderSheet();

function cancelConfirm(){
  sheet.confirming = false;
  renderSheet();
}
function commitAdjust(){
  const c = state.categories.find(c=>c.id===sheet.categoryId);
  if(!c){ closeSheet(); return; }
  const newVal = parseFloat(sheet.value);
  const delta = newVal - c.balance;
  c.balance = newVal;
  state.transactions.push({
    id: uid(),
    categoryId: c.id,
    kind: 'adjustment',
    amount: delta,
    note: '',
    date: new Date().toISOString()
  });

  sheet = null;

}

function pickCat(id){ sheet.categoryId = id; renderSheet(); }

function submitLog(){
  const amt = parseFloat(sheet.amount);
  if(!sheet.categoryId){ sheet.error = 'Add a fund first.'; renderSheet(); return; }
  if(isNaN(amt) || amt <= 0){ sheet.error = 'Enter an amount greater than 0.'; renderSheet(); return; }
  const cat = state.categories.find(c => c.id === sheet.categoryId);
  const overage = amt - cat.balance;
  const canBorrow = cat.allowBorrow !== false;
  const otherFunds = state.categories.filter(c => c.id !== cat.id);

  if(overage > 0.004 && (canBorrow || otherFunds.length > 0)){
    sheet = {
      type: 'overage',
      categoryId: cat.id,
      amount: amt,
      note: sheet.note,
      overage: overage,
      backupId: null,
      error: ''
    };
    render();
    return;
  }

  finalizePurchase(cat.id, amt, sheet.note);
}

function finalizePurchase(categoryId, amt, note){
  const cat = state.categories.find(c => c.id === categoryId);
  cat.balance -= amt;
  state.transactions.push({
    id: uid(),
    categoryId,
    kind: 'purchase',
    amount: amt,
    note: (note || '').trim(),
    date: new Date().toISOString()
  });
  persist();
  sheet = null;
  render();
}

function pickOverageBackup(id){ sheet.backupId = id; renderSheet(); }

function confirmOverage(){
  if(!sheet.backupId){ sheet.error = 'Pick how to cover the difference.'; renderSheet(); return; }

  const primary = state.categories.find(c => c.id === sheet.categoryId);
  if(!primary){ sheet = null; render(); return; }

  const amt = sheet.amount;
  const overage = sheet.overage;
  const note = (sheet.note || '').trim();

  if(sheet.backupId === '__borrow__'){
    primary.balance = 0; // fully used up by this purchase
    primary.borrowed = (primary.borrowed || 0) + overage;

    state.transactions.push({
      id: uid(), categoryId: primary.id, kind: 'purchase', amount: amt, note, date: new Date().toISOString()
    });
    state.transactions.push({
      id: uid(), categoryId: primary.id, kind: 'borrow', amount: overage,
      note: `Borrowed from next month's ${primary.name} allotment`, date: new Date().toISOString()
    });

    persist();
    sheet = null;
    render();
    return;
  }

  const backup = state.categories.find(c => c.id === sheet.backupId);
  if(!backup){ sheet = null; render(); return; }

  primary.balance = 0; // fully used up by this purchase
  backup.balance -= overage;

  state.transactions.push({
    id: uid(), categoryId: primary.id, kind: 'purchase', amount: amt, note, date: new Date().toISOString()
  });
  state.transactions.push({
    id: uid(), categoryId: backup.id, kind: 'purchase', amount: overage,
    note: `Covered overspend from ${primary.name}`, date: new Date().toISOString()
  });

  persist();
  sheet = null;
  render();
}

function renderLeftoverSheetHtml(){
  const pending = state.pendingLeftover;
  if(!pending) return '';
  const rolloverCats = state.categories.filter(c => c.type === 'rollover');
  const allocated = rolloverCats.reduce((s,c) => s + (parseFloat(pending.allocations[c.id]) || 0), 0);
  const remaining = pending.leftover - allocated;
  const rows = rolloverCats.map(c => `
    <div class="field" style="margin-bottom:10px;">

    </div>
  `).join('');
  return `
    <div class="sheet">
      <h2>Divvy up the leftover</h2>
      <div class="warn-box" style="background:rgba(47,166,107,0.1); border-color:rgba(47,166,107,0.35); color:#1f7a4d;">
        <b>You underspent by ${fmt(pending.leftover)} this month</b> across your reset funds. Decide how to split it across your rollover funds as a reward — anything left unassigned won't be added anywhere.

        <span>Remaining to assign</span>

        <button class="ghost-dark" onclick="splitLeftoverEvenly()">Split evenly</button>
        <button class="primary" style="background:var(--green-ok); color:#fff;" onclick="confirmLeftover()">Add to funds</button>
      </div>
      <div style="text-align:center; margin-top:14px;">
        <button class="preview-link" onclick="skipLeftover()">Skip for now (ask me later)</button>
      </div>
    </div>
  `;
}

function updateLeftoverRemainingDisplay(){
  const pending = state.pendingLeftover;
  if(!pending) return;
  const rolloverCats = state.categories.filter(c => c.type === 'rollover');
  const allocated = rolloverCats.reduce((s,c) => s + (parseFloat(pending.allocations[c.id]) || 0), 0);
  const remaining = pending.leftover - allocated;
  const valEl = document.getElementById('leftoverRemaining');
  const rowEl = document.getElementById('leftoverRemainingRow');
  if(valEl) valEl.textContent = fmt(remaining);
  if(rowEl) rowEl.style.color = remaining < -0.004 ? 'var(--rust)' : 'var(--ink-soft)';
}

function updateLeftoverAlloc(id, val){
  state.pendingLeftover.allocations[id] = val;
  updateLeftoverRemainingDisplay();
}

function splitLeftoverEvenly(){
  const pending = state.pendingLeftover;
  if(!pending) return;
  const rolloverCats = state.categories.filter(c => c.type === 'rollover');
  if(rolloverCats.length === 0) return;
  const each = (pending.leftover / rolloverCats.length);
  rolloverCats.forEach(c => {
    pending.allocations[c.id] = each.toFixed(2);
    const el = document.querySelector(`input[data-catid="${c.id}"]`);
    if(el) el.value = each.toFixed(2);
  });
  sheet.error = '';
  updateLeftoverRemainingDisplay();
}

function confirmLeftover(){
  const pending = state.pendingLeftover;
  if(!pending){ sheet = null; render(); return; }
  const rolloverCats = state.categories.filter(c => c.type === 'rollover');
  const allocated = rolloverCats.reduce((s,c) => s + (parseFloat(pending.allocations[c.id]) || 0), 0);
  if(allocated - pending.leftover > 0.004){
    sheet.error = "You've assigned more than the leftover amount.";
    renderSheet();
    return;
  }
  rolloverCats.forEach(c => {
    const amt = parseFloat(pending.allocations[c.id]) || 0;
    if(amt > 0.004){
      c.balance += amt;
      state.transactions.push({
        id: uid(), categoryId: c.id, kind: 'deposit', amount: amt,
        note: 'Underspending reward from last month', date: new Date().toISOString()
      });
    }
  });
  state.pendingLeftover = null;
  persist();
  sheet = null;
  render();
}

function skipLeftover(){
  // state.pendingLeftover is intentionally left in place so this can be reopened later from Settings
  sheet = null;
  render();
}

function submitAddFunds(){
  const amt = parseFloat(sheet.amount);
  if(!sheet.categoryId){ sheet.error = 'Pick a fund first.'; renderSheet(); return; }
  if(isNaN(amt) || amt <= 0){ sheet.error = 'Enter an amount greater than 0.'; renderSheet(); return; }
  const cat = state.categories.find(c => c.id === sheet.categoryId);
  cat.balance += amt;
  state.transactions.push({
    id: uid(),
    categoryId: sheet.categoryId,
    kind: 'deposit',
    amount: amt,
    note: sheet.note.trim(),
    date: new Date().toISOString()
  });
  persist();
  sheet = null;
  render();
}

function deleteTx(id){
  const tx = state.transactions.find(t => t.id === id);
  if(!tx) return;
  const cat = state.categories.find(c => c.id === tx.categoryId);
  if(cat){
    if(tx.kind === 'adjustment'){
      cat.balance -= tx.amount; // amount is a signed delta, so undo by subtracting it
    } else if(tx.kind === 'deposit'){
      cat.balance -= tx.amount; // deposits added money, so undo by subtracting it
    } else if(tx.kind === 'borrow'){
      cat.borrowed = Math.max(0, (cat.borrowed || 0) - tx.amount); // undo the future debt, balance is untouched
    } else {
      cat.balance += tx.amount; // purchases store a positive spend amount
    }
  }
  state.transactions = state.transactions.filter(t => t.id !== id);
  persist();
  render();
}

/* ---------- Settings actions ---------- */
function deleteCat(id){
  const c = state.categories.find(c=>c.id===id);
  if(!c) return;
  sheet = { type:'delcat', categoryId: id };
  render();
}
function confirmDeleteCat(){
  if(historyFilter === sheet.categoryId) historyFilter = 'all';
  state.categories = state.categories.filter(c=>c.id!==sheet.categoryId);
  persist();
  sheet = null;
  render();
}
function addCategory(){
  const newCat = { id: uid(), name: 'New Fund', type: 'rollover', amount: 0, balance: 0, borrowed: 0, allowBorrow: true };
  state.categories.push(newCat);
  persist();
  openEditCatSheet(newCat.id);
}
function moveCategory(id, direction){
  const idx = state.categories.findIndex(c => c.id === id);
  if(idx === -1) return;
  const swapWith = direction === 'up' ? idx - 1 : idx + 1;
  if(swapWith < 0 || swapWith >= state.categories.length) return;
  const temp = state.categories[idx];
  state.categories[idx] = state.categories[swapWith];
  state.categories[swapWith] = temp;
  persist();
  render();
}
function openMonthTestSheet(){
  if(!demoMode) return; // only available in preview mode, never on a live connected sheet
  sheet = { type: 'monthtest' };
  render();
}
function confirmMonthTest(){
  sheet = null; // close this confirmation sheet first
  applyMonthRollover(); // may open a new 'leftover' sheet if funds were underspent
  render();
}

function setTab(t){
  if(t === activeTab) return;
  activeTab = t;
  sheet = null;
  render(); // renders with trackPos still at the old position, so nothing jumps yet
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      trackPos = activeTab;
      const track = document.getElementById('tabTrack');
      if(track) track.style.transform = trackPos === 'home' ? 'translateX(0%)' : 'translateX(-50%)';
    });
  });
}

function setHistoryFilter(id){
  historyFilter = id;
  render();
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* ---------- Swipe between Funds / History ---------- */
function setupSwipe(){
  const app = document.getElementById('app');
  let startX = 0, startY = 0, tracking = false;

  app.addEventListener('touchstart', (e) => {
    if(sheet || settingsOpen || setupMode){ tracking = false; return; }
    const t = e.touches[0];
    startX = t.clientX;
    startY = t.clientY;
    tracking = true;
  }, { passive: true });

  app.addEventListener('touchend', (e) => {
    if(!tracking) return;
    tracking = false;
    const t = e.changedTouches[0];
    const dx = t.clientX - startX;
    const dy = t.clientY - startY;
    const minDistance = 60;
    if(Math.abs(dx) < minDistance || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    if(dx < 0 && activeTab === 'home') setTab('history');
    else if(dx > 0 && activeTab === 'history') setTab('home');
  }, { passive: true });
}

function init(){
  setupSwipe();
  config = getConfig();
  if(!config){
    setupMode = true;
    render();
  } else {
    loadData().then(startPolling);
  }
}
init();
</script>
